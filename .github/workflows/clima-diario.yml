name: Clima diário

# Só por disparo — o horário das 23h vive no cron da Vercel, em `vercel.json`,
# que chama `/api/clima/publicar` e cai no `workflow_dispatch` daqui.
#
# O `schedule:` do GitHub morava aqui e foi removido: ele não é um horário, é
# uma fila compartilhada. Em 19/08/2026 atrasou 2h10 e disparou 01h10 — e às
# 01h a janela móvel de 24h da HG não alcança mais o fim do dia seguinte, então
# o job recusou gerar e nenhum card foi para as telas. O horário importa: às
# 23h a previsão do dia seguinte está fechada e o material fica pronto antes da
# rotina do time no portal do KUMA.
on:
  workflow_dispatch:
    inputs:
      data:
        description: "Data de veiculação (YYYY-MM-DD). Vazio = amanhã."
        required: false
      indice:
        # Sem padrão de propósito. Com `default: "1"` o GitHub preenchia "1"
        # mesmo quando quem dispara manda vazio, e o script recebia `--indice=1`
        # fixo — então o segundo envio do mesmo dia repetia os nomes de arquivo,
        # que o Kuma reprova com 502 e feedback em branco, sem dizer o motivo.
        # Vazio deixa o script decidir: ele sobe um quando já existe registro.
        description: "Índice do material. Vazio = o script decide (sobe um a cada reenvio)."
        required: false
      modo:
        description: "dia ou semana"
        required: false
        default: "dia"
      duracao:
        description: "Duração em segundos"
        required: false
        default: "10"
      dry_run:
        description: "Só mostrar o payload, sem renderizar nem enviar"
        type: boolean
        required: false
        default: false

jobs:
  clima:
    runs-on: ubuntu-latest
    # Renderizar 250 frames em dois formatos e converter para H.265 leva
    # minutos; o teto existe para o job não ficar preso se o painel travar.
    #
    # Uma noite boa termina em ~20 min. O teto é folgado porque o job agora
    # espera pelos dois serviços de fora que já derrubaram o clima em agosto:
    # até 2×5 min pela HG publicar as horas e até 3 min pelo 500 de leitura do
    # Kuma, somados aos 10 min de propagação e aos 15 de auditoria.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Os ícones de umidade, chuva e vento do card são emoji. Sem esta fonte
      # eles saem como quadrado vazio no Chromium do runner.
      - name: Fonte de emoji
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji

      - name: Localizar o Chrome
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          elif [ -x /usr/bin/chromium-browser ]; then
            echo "CHROME_PATH=/usr/bin/chromium-browser" >> "$GITHUB_ENV"
          else
            echo "Nenhum Chrome no runner" >&2
            exit 1
          fi

      - name: Gerar e enviar o clima
        env:
          # O runner é UTC. Sem isto, "amanhã" às 02:00 UTC vira D+2 em vez do
          # D+1 que são 23h de Brasília — e o card sai de um dia cuja previsão
          # horária ainda não existe.
          TZ: America/Sao_Paulo
          APP_URL: ${{ secrets.APP_URL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KUMA_API_URL: ${{ secrets.KUMA_API_URL }}
          KUMA_API_KEY: ${{ secrets.KUMA_API_KEY }}
          KUMA_BIDDER_WEATHER: ${{ secrets.KUMA_BIDDER_WEATHER }}
        run: |
          args=""
          [ -n "${{ inputs.data }}" ]    && args="$args --data=${{ inputs.data }}"
          [ -n "${{ inputs.indice }}" ]  && args="$args --indice=${{ inputs.indice }}"
          [ -n "${{ inputs.modo }}" ]    && args="$args --modo=${{ inputs.modo }}"
          [ -n "${{ inputs.duracao }}" ] && args="$args --duracao=${{ inputs.duracao }}"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          npm run clima:diario -- $args
